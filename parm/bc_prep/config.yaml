# ============================================================================
# WoFS v1.0 BC_PREP configuration
#
# Stages:
#   UNGRIB -> METGRID -> REAL -> MEAN -> PERTURB
#
# Runtime variables:
#   HOMEwofs       Repository root
#   DATAROOT       Working-data root
#   WOFS_PYTHON    Python interpreter with PyYAML
#   CDATE          WoFS cycle (YYYYMMDDHH)
#
# Configuration policy:
#   Fixed scientific settings are validated by the loader.
#   Runtime settings may be overridden by environment variables.
#   Unsupported scientific settings are rejected.
#
# Stage-specific cycle, member, and lead variables are supplied by the
# workflow rather than fixed in this configuration.
# ============================================================================

paths:
  # Documentary placeholders; runtime paths come from the environment.
  homewofs: ""
  dataroot: ""
  comroot: ""

  # Fixed default directory suffixes.
  bc_subdir: "WoF_BC"
  gefs_subdir: "gefs"
  hrrr_subdir: "pert_hrrr"

gefs:
  source_dir: "/public/data/grids/gens"

  # Fixed WoFS v1.0 boundary ensemble and GEFS schedule.
  ensemble_size: 18
  cycles: 11
  interval_hours: 3

  # Legacy GEFS initialization is CDATE minus 6 hours.
  initialization_lag_hours: 6

sst:
  source_dir: "/public/data/grids/ncep/sst/0p083deg/grib2"

  # Legacy setting; not a replacement for the SST source-date calculation.
  cycle: "06"

  # Legacy UNGRIB selects the SST source date independently:
  # GEFS_INIT minus 24 hours, using the source day's 00Z file.
  source_lag_from_gefs_init_hours: 24
  source_hour: "00"

hrrr:
  wrfnat_dir: "/public/data/grids/hrrr/conus/wrfnat/grib2"
  wrfprs_dir: "/public/data/grids/hrrr/conus/wrfprs/grib2"

ungrib:
  # Must agree with gefs.ensemble_size.
  members: 18

metgrid:
  mpi_tasks: 40
  namelist: "namelist.wps.GFSENS"

real:
  # Default template confirmed against legacy Rocoto XML.
  # The existing runtime namelist override remains supported.
  namelist: "real.nl.32and4levels"

  # Match the validated Slurm REAL allocation.
  mpi_tasks: 160

mean:
  mpi_tasks: 40
  ensemble_size: 18
  executable: "average_netcdf_files_parallel.x"

perturb:
  # Regression remains the safe default.
  # Operational execution must be explicitly selected.
  execution_mode: "regression"

  # Authorized operational output roots.
  # Supply these through site configuration or the environment.
  operational_work_root: ""
  operational_com_root: ""

  # Historical output directories that must not be modified.
  # Configure these through site settings or the environment.
  protected_work_root: ""
  protected_com_root: ""

  # Legacy operational and regression XML both specify 0.
  # Values 0 and 1 are supported; regression validation used 0.
  soil_from_wrfprs: 0

  # Legacy Rocoto minimum GRIB2 file size in bytes.
  min_file_size: 1000000000

  # Preserve the existing NCL implementation.
  ncl_script: "perturb_hrrr.ncl"
  netcdf_to_grib_script: "netcdf_to_grib.py"

  # Legacy GEFS time-search limits.
  search_before_hours: 6
  search_after_hours: 6
